# coturn — OPTIONAL prod-grade TURN (docker-compose --profile coturn).
# Only needed if you turn OFF LiveKit's embedded TURN (turn.enabled:false in
# livekit.yaml). For the Phase 0 spike, embedded TURN is simpler — this file is
# here so prod NAT traversal is a config flip, not a rebuild.

listening-port=3478
tls-listening-port=5349

# Public IP of the TURN host. REQUIRED in prod (replace).
# external-ip=YOUR.PUBLIC.IP

# Relay port range — open these UDP ports on the firewall.
min-port=49152
max-port=65535

# Auth. LiveKit uses short-lived credentials; for a static prod secret use:
use-auth-secret
static-auth-secret=devsecret_please_change_me_0123456789abcdef
realm=turn.example.com

# TLS (prod): point at real certs (Let's Encrypt, etc.).
# cert=/etc/coturn/turn.crt
# pkey=/etc/coturn/turn.key

# Hardening.
no-cli
no-multicast-peers
no-tcp-relay
fingerprint

log-file=stdout
verbose
