# LiveKit SFU config — Phase 0.
# Keep the key/secret here in sync with egress.yaml, ingress.yaml, and the
# spike token script (scripts env). Replace the dev secret before any real deploy.

port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # PROD (cloud box): true so the server advertises its PUBLIC ip in ICE candidates.
  # With false it hands out the docker-internal IP (172.x) and media never connects.
  # Set false only for pure-localhost dev.
  use_external_ip: true

redis:
  address: redis:6379

# NO `keys:` BLOCK HERE — ON PURPOSE. This file is tracked in git, so a secret in
# it is a published secret. The key/secret pair is injected at runtime by
# docker-compose from the gitignored .env, as:
#
#   LIVEKIT_KEYS: "<LIVEKIT_API_KEY>: <LIVEKIT_API_SECRET>"
#
# The env var fully replaces this block. Secret MUST be >= 32 chars.
# ONE pair, shared by the SFU, Egress and Ingress.

# Embedded TURN — enough to prove NAT traversal in the spike.
# For prod, prefer dedicated coturn (docker-compose --profile coturn) + real TLS,
# and set enabled: false here.
turn:
  enabled: true
  domain: livekit.rekindlebc.com
  udp_port: 3478
  # tls_port: 5349        # prod: terminate TLS here or at a load balancer
  # cert_file: /etc/tls/turn.crt
  # key_file: /etc/tls/turn.key

logging:
  level: info

# Webhooks — the SFU POSTs signed events (egress_ended, etc.) here. Required for
# recording completion to flip livekit_recordings rows to 'completed' + duration.
#
# ⚠️ `api_key` is the key NAME — not the secret, and NOT a LiveKit Cloud key. It
# must equal LIVEKIT_API_KEY in .env, because LiveKit signs the webhook with
# keys[api_key]; if the name isn't found the secret lookup returns empty and the
# server dies at boot with "api_key is required to use webhooks".
# Safe to keep in git: a key name grants nothing on its own.
webhook:
  api_key: devkey
  urls:
    - https://vpnpembyqbbaaiynfvli.supabase.co/functions/v1/livekit-webhook

# Auto-close idle rooms (replaces most of daily-room-cleanup — see plan §7 1E).
room:
  empty_timeout: 300        # seconds with no participants before the room closes
  max_participants: 0       # 0 = unlimited; presets can be overridden per-room later
