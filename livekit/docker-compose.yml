# Self-hosted LiveKit stack (SFU + Egress + Ingress + TURN).
#
#   cp .env.example .env      # then fill in secrets/domains — .env is gitignored
#   docker compose --profile tls up -d
#
# NO SECRETS IN THIS FILE, OR IN config/*.yaml. Every credential is interpolated
# from .env at `docker compose up` time. Egress and Ingress take their whole
# config through *_CONFIG_BODY rather than a mounted yaml, precisely so their
# api_secret never has to exist on disk in a tracked file.
#
# All services share ONE api key/secret pair (LIVEKIT_API_KEY / LIVEKIT_API_SECRET).

services:
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    # ⚠️ NEVER publish this port. Docker's published ports BYPASS ufw (it writes its
    # own iptables rules), so "ports: 6379:6379" exposes an unauthenticated Redis to
    # the whole internet — which gets it hijacked with REPLICAOF, and is routinely
    # escalated to RCE. livekit/egress/ingress reach it over the internal docker
    # network by service name; nothing needs it from the host.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---- SFU (the room) ------------------------------------------------------
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Overrides `keys:` in livekit.yaml, which is why that file has none.
      # Format is "<name>: <secret>". The name must equal webhook.api_key.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    # Only what MUST be internet-reachable is published. Caddy proxies wss:// on 443
    # to livekit:7880 over the internal network, so 7880 stays on loopback.
    # (Reminder: published ports bypass ufw — publish nothing you don't need.)
    ports:
      - "127.0.0.1:7880:7880"  # HTTP/WS signaling — fronted by Caddy on 443
      - "7881:7881"            # RTC over TCP (fallback) — must be public
      - "3478:3478/udp"        # embedded TURN — must be public
      - "50000-50100:50000-50100/udp"  # RTC media — must be public
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro

  # ---- Egress (recording / HLS / RTMP-out) ---------------------------------
  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      EGRESS_CONFIG_BODY: |
        redis:
          address: redis:6379
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        s3:
          access_key: ${S3_ACCESS_KEY}
          secret: ${S3_SECRET}
          bucket: ${S3_BUCKET}
          region: ${S3_REGION}
          endpoint: ${S3_ENDPOINT}
          force_path_style: ${S3_FORCE_PATH_STYLE}
        logging:
          level: info
    # Headless Chrome for room-composite egress needs these.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    shm_size: "1gb"

  # ---- Ingress (RTMP / WHIP in) --------------------------------------------
  ingress:
    image: livekit/ingress:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      INGRESS_CONFIG_BODY: |
        redis:
          address: redis:6379
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        rtmp_port: 1935
        whip_port: 8080
        http_relay_port: 9090
        logging:
          level: info
    ports:
      - "1935:1935"   # RTMP (point OBS here)
      - "8080:8080"   # WHIP (WebRTC ingest)
      # 9090 is the internal HTTP relay — never publish it.

  # ---- Dev-only S3 target for Egress output --------------------------------
  # In prod, delete this and point S3_ENDPOINT at real S3/R2/GCS.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET}
    # Bound to LOOPBACK only — default creds on a public port is a free bucket for
    # anyone scanning. Reach the console via an SSH tunnel:
    #   ssh -L 9001:127.0.0.1:9001 root@<vps>   then open http://localhost:9001
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # web console
    volumes:
      - minio-data:/data

  # Creates the egress bucket on startup so recordings have somewhere to land.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET: ${S3_SECRET}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET) do echo 'waiting for minio'; sleep 2; done;
      mc mb -p local/$$S3_BUCKET;
      mc anonymous set download local/$$S3_BUCKET;
      echo 'minio ready';
      "

  # ---- coturn (OPTIONAL, prod-grade TURN) ----------------------------------
  # LiveKit's embedded TURN (config/livekit.yaml) is enough to start. For heavier
  # production NAT traversal, run a dedicated coturn instead and set
  # turn.enabled=false in livekit.yaml. Enable with:  --profile coturn
  # NOTE: coturn.conf has NO secret in it — fill static-auth-secret on the host
  # before enabling this profile (see the comment in that file).
  coturn:
    image: coturn/coturn:latest
    profiles: ["coturn"]
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/coturn.conf:/etc/coturn/turnserver.conf:ro

  # ---- Caddy (PROD TLS) ----------------------------------------------------
  # Browsers require wss:// for a hosted site. Caddy auto-provisions a Let's
  # Encrypt cert for livekit.<domain> and reverse-proxies HTTPS/WSS → the SFU's
  # plain ws on :7880. Enable with:  docker compose --profile tls up -d
  # Needs: DNS livekit.<domain> → this VPS, and ports 80+443 open.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - livekit
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  minio-data:
  caddy-data:
  caddy-config:
