<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="google-site-verification" content="GDJmweyG2SSSl2MncWsV8bvbUojXPQKMhICps-yWIdM" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- rekindlebc.com is the main site for search; CanonicalLink keeps the
         canonical and og:url in step with the route once the app loads. -->
    <link rel="canonical" href="https://rekindlebc.com/" />
    <meta name="description" content="ReKindle BC helps churches grow their congregation with devotionals, live services, prayer, meetings and community, all in one place." />

    <meta property="og:title" content="ReKindle BC — Digital Discipleship &amp; Ministry Platform" />
    <meta property="og:description" content="ReKindle BC helps churches grow their congregation with devotionals, live services, prayer, meetings and community, all in one place." />
    <meta property="og:url" content="https://rekindlebc.com/" />
    <meta property="og:image" content="https://rekindlebc.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ReKindle BC — Digital Discipleship &amp; Ministry Platform" />
    <meta name="twitter:description" content="ReKindle BC helps churches grow their congregation with devotionals, live services, prayer, meetings and community, all in one place." />
    <meta name="twitter:image" content="https://rekindlebc.com/og.jpg" />
    <title>ReKindle BC — Digital Discipleship &amp; Ministry Platform</title>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ReKindle BC",
      "url": "https://rekindlebc.com",
      "logo": "https://rekindlebc.com/icon-192.png",
      "description": "A global digital discipleship and evangelism ecosystem designed to support church and ministry leaders.",
      "sameAs": [
        "https://www.instagram.com/rekindlemediaoutreach"
      ]
    }
    </script>
    <!-- The landing page's fonts, requested up front: they used to start
         downloading only after the page had rendered (an @import inside the
         component), so the text visibly swapped fonts a moment after load. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=block" />
    <style>html.rk-dark-boot, html.rk-dark-boot body { background: #0f0a1e; }</style>
    <script src="/boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
