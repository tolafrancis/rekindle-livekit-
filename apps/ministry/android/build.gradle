// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // Native screen share (NativeScreenSharePlugin) — LiveKit's Android SDK is
        // Kotlin-native (suspend functions throughout Room.connect/publish), so the
        // plugin is written in Kotlin even though MainActivity stays Java; this is
        // a normal, well-supported mix in Capacitor Android projects.
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // Native screen share: io.livekit:livekit-android transitively depends on
        // com.github.davidliu:audioswitch, a JitPack-hosted (GitHub-commit-pinned)
        // artifact not on Maven Central.
        maven { url 'https://jitpack.io' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
