# Supabase CLI config.
# Scoped intentionally to Edge Functions — migrations are still applied by
# pasting SQL in the dashboard (safer given the existing manual migration
# history), so `db push` is not part of this workflow yet.

project_id = "rekindle-digital-mission"

[functions.spiritual-companion]
enabled = true
# The function verifies the user's JWT itself (supabase.auth.getUser), and the
# client sends a Bearer token, so gateway JWT verification stays on.
verify_jwt = true

[functions.evangelism-ai-suggestion]
enabled = true
verify_jwt = true

[functions.generate-prayer-content]
enabled = true
verify_jwt = true

[functions.generate-devotional-series]
enabled = true
# Admin/super_admin only (checked via user_profiles.role inside the function,
# same pattern as generate-prayer-content). Gateway JWT verification stays on.
verify_jwt = true

[functions.generate-devotional-day]
enabled = true
# Admin/super_admin only, same pattern as generate-devotional-series.
verify_jwt = true

[functions.detect-transcript-corrections]
enabled = true
# Ministry admin only (is_group_admin, checked inside the function) —
# per-ministry Sermon Library tool, not platform admin like the
# generate-devotional-* functions above.
verify_jwt = true

[functions.fetch-youtube-transcript]
enabled = true
# Same ministry-admin pattern as detect-transcript-corrections — a Sermon
# Library helper, not a public YouTube-scraping proxy.
verify_jwt = true

[functions.livekit-egress]
enabled = true
# start/stop-recording call supabase.auth.getUser() on the forwarded Bearer
# token themselves; list-recordings is intentionally open (read-only VOD
# list). Gateway JWT verification stays on, matching its livekit-token /
# livekit-moderation siblings — only livekit-webhook (LiveKit's own signed
# call, no Supabase JWT) needs it off.
verify_jwt = true

[functions.ministry-retention-sweep]
enabled = true
# Deletes recordings/video messages across every ministry — service-role only
# (the cron job). Its own decodeJwtRole() check only base64-decodes the
# Authorization header, it never verifies the signature, so with gateway
# verification off a forged unsigned "JWT" claiming role:service_role would
# pass both checks. Was found deployed with verify_jwt=false despite the
# function's own header comment saying it must stay on — restoring that.
verify_jwt = true

[functions.livekit-ingress]
enabled = true
# create/get/delete all reveal or manage a live RTMP stream key (unlike
# egress's list-recordings, which is a public playback URL) — every action
# requires supabase.auth.getUser() + channel-ownership. Gateway JWT
# verification stays on, matching livekit-egress/livekit-token/livekit-moderation.
verify_jwt = true

[functions.livekit-webhook]
enabled = true
# LiveKit signs webhook requests using its API Key & Secret HMAC payload signature,
# not a Supabase User JWT session. Gateway JWT verification must be disabled.
verify_jwt = false

[functions.translation-listener-token]
enabled = true
# Called by anonymous /display visitors with no real Supabase session — the
# JS client sends the anon key as Bearer, which passes gateway verify_jwt
# fine (it's a validly-signed project JWT, just role:anon), while the
# function's own anon-scoped Postgres lookup is the real access-control gate
# (see the file's header comment — same RLS the page's own row fetch uses).
verify_jwt = true

[functions.translation-list-voices]
enabled = true
# Proxies the TTS provider's own voice catalog for the settings UI's voice
# picker — requires a real signed-in user (auth.getUser() inside the
# function itself), not just any validly-signed project JWT, since this
# counts against our own TTS account's usage. Gateway JWT verification
# stays on, matching every other real-auth function in this file.
verify_jwt = true

[functions.translation-clone-voice]
enabled = true
# Admin-only (is_group_admin, checked before the costly provider call) —
# function does its own auth. Gateway JWT verification stays on.
verify_jwt = true

[functions.translation-delete-custom-voice]
enabled = true
# Admin-only (is_group_admin) — function does its own auth. Gateway JWT
# verification stays on.
verify_jwt = true

[functions.translation-search-voice-library]
enabled = true
# Read-only search against the TTS provider's PUBLIC voice library — no
# ministry-specific data involved, just requires a real signed-in user
# (prevents anonymous scraping/quota drain). Gateway JWT verification
# stays on.
verify_jwt = true

[functions.translation-add-library-voice]
enabled = true
# Admin-only (is_group_admin) — function does its own auth. Gateway JWT
# verification stays on.
verify_jwt = true

[functions.translation-device-publish-token]
enabled = true
# Called by the edge agent with a DEVICE bearer token (authenticate_device),
# never a Supabase user JWT — there is no user. Gateway JWT verification
# must be OFF, same reasoning as livekit-webhook: a device token isn't a
# validly-signed Supabase project JWT, so gateway verification would
# reject every legitimate call before the function's own device-token
# check ever runs.
verify_jwt = false

[functions.translation-speaker-token]
enabled = true
# Called by an anonymous browser holding only a per-session speaker token
# (migration 0288) — no Supabase session, same reasoning as
# translation-device-publish-token above. Gateway JWT verification off;
# the function validates the speaker token itself.
verify_jwt = false

# ---------------------------------------------------------------------------
# WhatsApp Business connection (MinistryWhatsAppConnect.tsx). Split out of a
# combined router file that was only ever partially deployed — see each
# function's own header comment. All five require a real signed-in ministry
# admin (checked via is_group_admin inside the function, same pattern as
# ministry-checkout), so gateway JWT verification stays on. whatsapp-save-
# credentials was the last holdout of this group still deployed outside this
# config with verify_jwt off and no in-function authorization check at all —
# now mirrored here with the same admin check as its siblings.
# ---------------------------------------------------------------------------
[functions.create-whatsapp-subscription]
enabled = true
verify_jwt = true

[functions.whatsapp-embedded-signup-complete]
enabled = true
verify_jwt = true

[functions.whatsapp-verify-connection]
enabled = true
verify_jwt = true

[functions.whatsapp-save-credentials]
enabled = true
verify_jwt = true

[functions.whatsapp-get-templates]
enabled = true
verify_jwt = true

[functions.send-small-group-whatsapp-notify]
enabled = true
# Requires a real signed-in small-group leader/ministry admin — checked via
# is_small_group_leader inside the function. Never blocks the caller's
# meeting/post creation: returns ok:true with a skipped reason instead of an
# error whenever WhatsApp isn't configured for the ministry.
verify_jwt = true

[functions.ministry-whatsapp-broadcast]
enabled = true
# Previously deployed outside this repo's tracked supabase/functions/ layout
# with no authorization check at all (userId trusted straight from the
# request body). Mirrored here when small-group targeting was added, along
# with a real check: a full ministry admin can broadcast any way; a
# small-group leader can only target their own group.
verify_jwt = true

[functions.whatsapp-webhook]
enabled = true
# Meta's Cloud API webhook for a ministry's connected WhatsApp Business
# Account (inbound messages -> Evangelism Inbox). Like livekit-webhook, Meta
# signs these requests itself (X-Hub-Signature-256), not with a Supabase
# JWT, so gateway JWT verification must be off. Was previously deployed
# outside this repo's tracked layout with a POST handler that logged the
# body and did nothing else — every real inbound message was silently
# discarded. Mirrored here with an actual fix; see the function's own
# header comment for the ministry-resolution and signature-verification
# details, including the known gap for ministries on their own separate
# Meta app (manual "Enter Credentials Manually" path) rather than
# Embedded Signup.
verify_jwt = false

[functions.evangelism-inbox-webhook]
enabled = true
# Inbound messages for the other three Evangelism Inbox channels
# (Messenger, Instagram, Twilio-relayed WhatsApp) — same situation as
# whatsapp-webhook above: complete, working logic that lived outside
# supabase/functions/ and so was never actually deployed. Meta/Twilio sign
# these requests themselves, not with a Supabase JWT, so gateway JWT
# verification is off, same reasoning as whatsapp-webhook and
# livekit-webhook.
verify_jwt = false

[functions.developer-api-keys]
enabled = true
# In-app management (create/list/revoke) of Interactive Meetings API keys.
# Requires a real signed-in user — verifies their own JWT (auth.getUser())
# inside the function, same pattern as its siblings above. Gateway JWT
# verification stays on.
verify_jwt = true

[functions.meetings-api]
enabled = true
# Public third-party "Interactive Meetings" API — callers have no Supabase
# account (they authenticate with a developer_api_keys bearer key instead),
# so gateway JWT verification MUST be off, matching livekit-webhook's own
# non-Supabase-JWT auth model.
verify_jwt = false

[functions.ministry-checkout]
enabled = true
# Called by a signed-in ministry leader/admin/owner (checked inside the
# function). Gateway JWT verification stays on.
verify_jwt = true

[functions.ministry-billing-webhook]
enabled = true
# Stripe and Paystack sign these requests themselves, not with a Supabase
# JWT — same reasoning as livekit-webhook/whatsapp-webhook. Gateway JWT
# verification must be off or Stripe's webhook calls get rejected with 401
# before the function's own signature check ever runs.
verify_jwt = false

[functions.stripe-subscription]
enabled = true
# Individual "Premium"/"Premium Plus" consumer checkout, called by the
# signed-in user's own browser session (supabase.functions.invoke attaches
# their Bearer token automatically). Gateway JWT verification stays on —
# the function itself trusts the userId in the request body rather than
# re-deriving it, so this is the actual auth boundary.
verify_jwt = true

[functions.stripe-webhook]
enabled = true
# Individual consumer subscription webhook — Stripe signs these requests
# itself, not with a Supabase JWT. Gateway JWT verification must be off or
# Stripe's webhook calls get rejected with 401 before the function's own
# signature check ever runs. Uses its OWN STRIPE_WEBHOOK_SECRET_CONSUMER
# secret, distinct from ministry-billing-webhook's STRIPE_WEBHOOK_SECRET —
# each Stripe webhook endpoint has its own signing secret.
verify_jwt = false

[functions.create-billing-portal]
enabled = true
# Called by the signed-in user's own browser session; the function also
# verifies the Bearer token itself via auth.getUser(). Gateway JWT
# verification stays on.
verify_jwt = true

[functions.cancel-subscription]
enabled = true
# Called by the signed-in user's own browser session; the function also
# verifies the Bearer token itself via auth.getUser(). Gateway JWT
# verification stays on.
verify_jwt = true

[functions.paystack-initialize]
enabled = true
# Individual consumer checkout via Paystack, called by the signed-in user's
# own browser session. Gateway JWT verification stays on, same reasoning as
# stripe-subscription.
verify_jwt = true

[functions.paystack-verify]
enabled = true
# Called right after the browser redirects back from Paystack checkout, by
# the signed-in user's own browser session. Gateway JWT verification stays
# on.
verify_jwt = true

[functions.paystack-webhook]
enabled = true
# Paystack signs these requests itself, not with a Supabase JWT — same
# reasoning as stripe-webhook. Gateway JWT verification must be off.
verify_jwt = false

[functions.ministry-connect-onboarding]
enabled = true
# Called by a signed-in ministry leader/admin/owner (checked inside the
# function via is_group_admin, same pattern as ministry-checkout). Gateway
# JWT verification stays on.
verify_jwt = true

[functions.ministry-donation-checkout]
enabled = true
# Called by the donor's own browser session — anonymous donors carry
# Supabase's anon-key JWT, which satisfies gateway verification without
# requiring a signed-in user; the function itself trusts the email/name in
# the request body, same trust model as the legacy create-donation function
# it replaces for the ministry+Stripe case. Gateway JWT verification stays on.
verify_jwt = true

[functions.ministry-donation-webhook]
enabled = true
# Stripe signs these requests itself (both payment_intent events and Connect
# account.updated events), not with a Supabase JWT — same reasoning as
# ministry-billing-webhook/stripe-webhook. Gateway JWT verification must be
# off or Stripe's calls get rejected with 401 before the function's own
# signature check runs. Uses its own STRIPE_WEBHOOK_SECRET_DONATIONS secret,
# distinct from ministry-billing-webhook's STRIPE_WEBHOOK_SECRET and
# stripe-webhook's STRIPE_WEBHOOK_SECRET_CONSUMER.
verify_jwt = false

[functions.create-donation]
enabled = true
# Called by a donor's own browser session — anonymous donors carry
# Supabase's anon-key JWT, which satisfies gateway verification without
# requiring a signed-in user; the function itself trusts the email/name in
# the request body, same trust model as ministry-donation-checkout. Gateway
# JWT verification stays on.
verify_jwt = true

[functions.send-whatsapp]
enabled = true
# Called from a signed-in admin's browser session (MinistryGroupsManager.tsx).
# The function itself does NOT verify the caller administers any ministry
# (known gap, flagged in its own header comment) — gateway JWT verification
# is the only real check today.
verify_jwt = true

[functions.broadcast-whatsapp]
enabled = true
# Called from a signed-in admin's browser session (BroadcastMessaging.tsx).
# Same known gap as send-whatsapp — no ministry-scoped authorization inside
# the function itself.
verify_jwt = true

[functions.evangelism-send-message]
enabled = true
# Called from a signed-in ministry admin's browser session
# (EvangelismInbox.tsx). The function verifies the caller via
# auth.getUser() AND is_group_admin(ministryId) internally, so this needs a
# real user JWT, not just the anon key. Gateway JWT verification stays on.
verify_jwt = true
